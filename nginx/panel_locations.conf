# DoH via reverse proxy: http(s)://HOST:PORT/dns-query → DNS engine HTTPS :443
# Variable + resolver — re-resolve after container recreate (no stale IP / 502).
location = /dns-query {
    set $doh_upstream technitium:443;
    # без URI в proxy_pass — иначе variable ломает путь
    proxy_pass https://$doh_upstream;
    proxy_http_version 1.1;
    proxy_ssl_verify off;
    proxy_ssl_server_name on;
    proxy_ssl_name dns-panel;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    set $panel_upstream panel:8000;
    # URI не дублировать: variable + /api/ → 404
    proxy_pass http://$panel_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
}

location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
