worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream panel_upstream {
        server panel:8000;
    }

    upstream technitium_doh {
        server technitium:8053;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP :80 — generated by panel (serve UI or redirect → HTTPS)
    include /etc/nginx/generated/http.conf;

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/ssl/panel.crt;
        ssl_certificate_key /etc/nginx/ssl/panel.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        include /etc/nginx/panel_locations.conf;
    }
}
